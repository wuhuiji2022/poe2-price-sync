name: PoE2 价格同步

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓一轮价格
        env:
          POE2_LEAGUE: Forbidden Rites
        run: python3 cloud_fetch.py

      - name: 推送到 data 分支（单 commit 强推）
        env:
          GIT_AUTHOR_NAME: poe2-sync-bot
          GIT_AUTHOR_EMAIL: bot@example.com
          GIT_COMMITTER_NAME: poe2-sync-bot
          GIT_COMMITTER_EMAIL: bot@example.com
        run: |
          set -e
          git checkout --orphan data
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f data.json
          git commit -m "sync $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -f origin data
